name: Build macOS Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.5)'
        required: true

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Publish self-contained ${{ matrix.rid }} build
        run: |
          dotnet publish src/PharmacyMS.Desktop/PharmacyMS.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o ./publish/${{ matrix.rid }}

      - name: Pack into .app with Velopack
        run: |
          vpk pack \
            --packId PharmacyMS \
            --packVersion ${{ github.event.inputs.version }} \
            --packDir ./publish/${{ matrix.rid }} \
            --mainExe PharmacyMS.Desktop \
            --icon ./src/PharmacyMS.Desktop/Assets/pharmapro-icon.icns \
            --packTitle "PharmacyMS" \
            --packAuthors "AL-HIJRA PHARMACY" \
            --channel ${{ matrix.rid }} \
            --outputDir ./release-${{ matrix.rid }}

      - name: Upload installer as build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PharmacyMS-macOS-${{ matrix.rid }}
          path: ./release-${{ matrix.rid }}/*

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create mac-${{ github.event.inputs.version }}-${{ matrix.rid }} \
            ./release-${{ matrix.rid }}/* \
            --title "macOS ${{ matrix.rid }} v${{ github.event.inputs.version }}" \
            --notes "macOS (${{ matrix.rid }}) release ${{ github.event.inputs.version }}" \
            --prerelease
