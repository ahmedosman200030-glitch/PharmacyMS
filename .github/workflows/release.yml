name: Release Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.5)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Inject Resend API key
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf 'namespace PharmacyMS.Desktop.Services;\ninternal static class ResendApiKeyProvider\n{\n    internal const string Key = "%s";\n}\n' "$RESEND_API_KEY" > src/PharmacyMS.Desktop/Services/ResendApiKeyProvider.cs

      - name: Publish
        run: dotnet publish src/PharmacyMS.Desktop/PharmacyMS.Desktop.csproj -c Release -r win-x64 --self-contained -o ./publish -p:Version=${{ github.event.inputs.version }} -p:AssemblyVersion=${{ github.event.inputs.version }}.0 -p:FileVersion=${{ github.event.inputs.version }}.0 -p:InformationalVersion=${{ github.event.inputs.version }}

      - name: Pack with vpk
        run: vpk pack --packId PharmacyMS --packVersion ${{ github.event.inputs.version }} --packDir ./publish --outputDir ./Releases --mainExe PharmacyMS.Desktop.exe --icon src/PharmacyMS.Desktop/Assets/pharmapro-icon.ico

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ github.event.inputs.version }} `
            ./Releases/PharmacyMS-${{ github.event.inputs.version }}-delta.nupkg `
            ./Releases/PharmacyMS-${{ github.event.inputs.version }}-full.nupkg `
            ./Releases/PharmacyMS-win-Setup.exe `
            ./Releases/releases.win.json `
            --title "v${{ github.event.inputs.version }}" `
            --notes "Version ${{ github.event.inputs.version }} release" `
            --latest
